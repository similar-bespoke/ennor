name: Update Resources HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"

      - name: List directory contents
        run: ls -la  # See what’s in the root directory

      - name: Run script to update resources
        run: python generate_doc_links.py

      - name: Check generated files
        run: ls -la *.html  # List all HTML files after running the script

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt
        run: npm install -g staticrypt@3.1.0

      - name: Encrypt resources.html
        run: |
          if [ -f resources.html ]; then
            staticrypt resources.html -p "${{ secrets.PAGE_PASSWORD }}" --short -d encrypted
            rm resources.html  # Remove unencrypted original
            ls -la encrypted/  # Confirm output
          else
            echo "Error: resources.html not found"
            exit 1
          fi

      - name: List encrypted files
        run: ls -la encrypted/  # Verify encrypted output

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add encrypted/resources.html *_contents.html  # Add encrypted and unencrypted HTML files
          git diff --staged --quiet || git commit -m "Update encrypted resources.html and other HTML files"
          git push
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false  # Ensures clean deployment
