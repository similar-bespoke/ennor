name: Update Resources HTML

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: List directory contents
        run: ls -la  # See what’s in the root directory

      - name: Run script to update resources
        run: python generate_doc_links.py

      - name: Check generated files
        run: ls -la *.html  # List all HTML files after running the script

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install StatiCrypt
        run: npm install -g staticrypt

      - name: Encrypt resources.html
        run: staticrypt resources.html "${{ secrets.PAGE_PASSWORD }}" -o resources.html
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add resources.html *_contents.html  # Add all generated HTML files
          git diff --staged --quiet || git commit -m "Update resources and library contents HTML files"
          git push
        shell: bash

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: false  # Ensures clean deployment